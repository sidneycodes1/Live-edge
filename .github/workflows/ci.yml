name: CI

# Mechanical gates only (check-secrets, lint, tests, build). Judgment-level
# verification (diff-vs-claims, honesty review, live curls) stays the lead's
# step — CI cannot tell you a green suite was quietly weakened.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR so you don't waste minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version matches "packageManager" in package.json (pnpm@9.12.3).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build if a real secret/API key was ever committed.
      - name: Secret scan
        run: pnpm check-secrets

      - name: Lint
        run: pnpm lint

      # Server suite runs on embedded PGlite with mocked provider fetch — no creds needed.
      # Root `pnpm test` is `pnpm -r test` → server (node:test) + web (vitest).
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
